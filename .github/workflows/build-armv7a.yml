name: Build RikkaHub APK for ARMv7a

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install web-ui dependencies
        run: |
          cd web-ui
          pnpm install

      - name: Unpack material-color-utilities kotlin
        run: |
          if [ -f kotlin.zip ]; then
            mkdir -p material3/material-color-utilities
            unzip -q kotlin.zip -d material3/material-color-utilities/
            rm kotlin.zip
            echo "✅ kotlin.zip unpacked to material3/material-color-utilities/"
          else
            echo "⚠️ kotlin.zip not found, attempting sparse clone..."
            git clone --depth 1 --filter=blob:none --sparse \
              https://github.com/material-foundation/material-color-utilities.git temp
            cd temp
            git sparse-checkout set kotlin
            cd ..
            mkdir -p material3/material-color-utilities
            mv temp/kotlin material3/material-color-utilities/
            rm -rf temp
          fi

      - name: Add google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: echo $GOOGLE_SERVICES_JSON > app/google-services.json

      - name: Modify build.gradle.kts to include armeabi-v7a and x86
        run: |
          sed -i 's/abiFilters += listOf("arm64-v8a", "x86_64")/abiFilters += listOf("armeabi-v7a", "arm64-v8a", "x86", "x86_64")/' app/build.gradle.kts

      - name: Build Release APK
        run: ./gradlew assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RikkaHub-armv7a
          path: app/build/outputs/apk/release/*.apk
