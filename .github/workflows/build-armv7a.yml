name: Build RikkaHub APK for ARMv7a (with libsimple.so)

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  # ========== 任务1：编译 libsimple.so for armeabi-v7a ==========
  build-libsimple:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout libsimple source
        uses: actions/checkout@v4
        with:
          repository: wangfenjin/simple
          path: libsimple

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26d

      - name: Build libsimple for armeabi-v7a
        run: |
          cd libsimple
          mkdir -p build && cd build
          cmake -DCMAKE_TOOLCHAIN_FILE=$ANDROID_HOME/ndk/${{ steps.setup-ndk.outputs.ndk-version }}/build/cmake/android.toolchain.cmake \
                -DANDROID_ABI=armeabi-v7a \
                -DANDROID_PLATFORM=android-26 \
                -DBUILD_SQLITE3=OFF \
                -DCMAKE_BUILD_TYPE=Release ..
          make

      - name: Upload libsimple.so artifact
        uses: actions/upload-artifact@v4
        with:
          name: libsimple-armeabi-v7a
          path: libsimple/build/libsimple.so
          
  # ========== 任务2：主构建（依赖上面的编译结果） ==========
  build:
    needs: build-libsimple
    runs-on: ubuntu-latest
    steps:
      - name: Checkout RikkaHub code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install web-ui dependencies
        run: |
          cd web-ui
          pnpm install

      - name: Setup material-color-utilities
        run: |
          if [ -f kotlin.zip ]; then
            mkdir -p material3/material-color-utilities
            unzip -q kotlin.zip -d material3/material-color-utilities/
            rm kotlin.zip
          else
            git clone --depth 1 --filter=blob:none --sparse \
              https://github.com/material-foundation/material-color-utilities.git temp
            cd temp && git sparse-checkout set kotlin && cd ..
            mkdir -p material3/material-color-utilities
            mv temp/kotlin material3/material-color-utilities/
            rm -rf temp
          fi

      - name: Add google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: echo "$GOOGLE_SERVICES_JSON" > app/google-services.json

      - name: Modify build.gradle.kts to include armeabi-v7a
        run: |
          sed -i 's/abiFilters += listOf("arm64-v8a", "x86_64")/abiFilters += listOf("armeabi-v7a", "arm64-v8a", "x86", "x86_64")/' app/build.gradle.kts

      # ========== 关键步骤：下载编译好的 libsimple.so 并放入 jniLibs ==========
      - name: Download libsimple.so artifact
        uses: actions/download-artifact@v4
        with:
          name: libsimple-armeabi-v7a
          path: app/src/main/jniLibs/armeabi-v7a/

      # （可选）验证文件是否存在
      - name: Verify libsimple.so placement
        run: ls -la app/src/main/jniLibs/armeabi-v7a/

      # ========== 签名配置 ==========
      - name: Setup signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > keystore.p12

      - name: Build Release APK with signing
        run: |
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=$PWD/keystore.p12 \
            -Pandroid.injected.signing.store.password=${{ secrets.SIGNING_KEYSTORE_PASSWORD }} \
            -Pandroid.injected.signing.key.alias=${{ secrets.SIGNING_KEY_ALIAS }} \
            -Pandroid.injected.signing.key.password=${{ secrets.SIGNING_KEY_PASSWORD }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RikkaHub-armv7a-release
          path: app/build/outputs/apk/release/*.apk
